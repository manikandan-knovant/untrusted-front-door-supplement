# Threat catalog for AI agents in health-plan workflows, covering agents on both sides of the
# payer-provider exchange (operator = whose agent it is) plus a clinical-documentation contrast set.
# Scope: threats and impact types only (integrity, confidentiality, both). No attack payloads,
# no evaluation methods. Every scenario is [author analysis] grounded in the listed sources
# (lit/sources/<ID>.md); "reasoning_ref" points to reasoning_log.md entries.
# Format: strict YAML subset (a list of flat mappings, double-quoted values) so that
# check_catalog.py can parse it with the standard library only.

threats:
  - id: "T-001"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI01"
    entry_surface: "x12"
    scenario: "In programs whose companion guides let a 278 request carry free-form message text, the payer intake agent reads that text as instructions. Instead of summarising medical necessity, it recommends approval or marks the request complete. Some programs restrict or do not use this segment, so the exposure depends on trading-partner rules."
    impact_type: "integrity"
    source: "STD05; STD01; F01; S11"
    reasoning_ref: "R-23; R-24; R-30"
  - id: "T-002"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI01"
    entry_surface: "ccda"
    scenario: "Directive text sits in the human-readable narrative of a C-CDA document submitted as clinical evidence. The review agent treats it as reviewer guidance and drafts a determination rationale citing criteria that the coded entries do not support."
    impact_type: "integrity"
    source: "STD03; F01; S06; S11"
    reasoning_ref: "R-23; R-24; R-25"
  - id: "T-003"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI01"
    entry_surface: "fax_ocr"
    scenario: "Faxed clinical notes are run through OCR before the agent reads them. Text a human reviewer cannot see on the page is extracted and steers the agent's recommended determination."
    impact_type: "integrity"
    source: "S33; S35; S06; REG02"
    reasoning_ref: "R-23; R-24; R-31"
  - id: "T-004"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "trading_partner"
    owasp_asi: "ASI06"
    entry_surface: "fhir"
    scenario: "Data received from a member's previous plan over a FHIR payer-to-payer exchange includes a free-text element with false clinical content. The agent stores it in the member's case context, where it shapes later prior-authorisation decisions for that member."
    impact_type: "integrity"
    source: "REG01; S30; S06; STD04; S70"
    reasoning_ref: "R-23; R-25; R-31"
  - id: "T-005"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI02"
    entry_surface: "fhir"
    scenario: "A request arrives through the FHIR prior-authorisation interface that payers must offer from 2027, and its supporting-information strings steer an agent holding legitimate write access to the utilisation-management system. The agent extends approved units or date spans beyond the request, or updates a different authorisation."
    impact_type: "integrity"
    source: "REG01; STD04; S39; S67; F01"
    reasoning_ref: "R-23; R-25; R-33"
  - id: "T-006"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "insider"
    owasp_asi: "ASI03"
    entry_surface: "agent_to_agent"
    scenario: "A provider-side submission agent acts for many clinicians under one delegated credential, and the payer agent cannot tell which clinician is asking. A staff member uses the shared credential to file requests outside a clinician's scope. The payer intake agent's broad read rights also expose unrelated member history."
    impact_type: "both"
    source: "S61; S29; S26; S11"
    reasoning_ref: "R-23; R-25; R-29"
  - id: "T-007"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "trading_partner"
    owasp_asi: "ASI07"
    entry_surface: "agent_to_agent"
    scenario: "Provider and payer agents exchange status messages, for example that documentation was sent or that a peer-to-peer review took place, over a channel that does not bind sender identity or protect integrity. A compromised intermediary alters or spoofs a message, and the payer agent advances the case on it."
    impact_type: "integrity"
    source: "S64; S01; O01; ADV02"
    reasoning_ref: "R-23; R-25; R-29"
  - id: "T-008"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI08"
    entry_surface: "events"
    scenario: "A determination steered by submitted content publishes an event. Downstream agents act on it: provider letters, member notices and claims-edit set-up follow, so one steered decision spreads across workflows before any human review."
    impact_type: "integrity"
    source: "S62; S26; O01"
    reasoning_ref: "R-23; R-25"
  - id: "T-009"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI09"
    entry_surface: "chat"
    scenario: "A clinical reviewer relies on the agent's fluent case summary. The summary repeats a planted false detail or leaves out contradicting evidence, and the reviewer signs a determination they would not otherwise make."
    impact_type: "integrity"
    source: "S63; S06; S70"
    reasoning_ref: "R-23; R-25"
  - id: "T-010"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "upstream_supplier"
    owasp_asi: "ASI04"
    entry_surface: "knowledge"
    scenario: "A third-party component the agent depends on, such as a criteria content package, an installed skill or a document parser, is altered upstream. The agent then applies altered review criteria to every request it handles."
    impact_type: "integrity"
    source: "S60; S24; O01"
    reasoning_ref: "R-23; R-25"
  - id: "T-011"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "none"
    owasp_asi: "ASI10"
    entry_surface: "internal"
    scenario: "No external input and no adversary are involved. The agent drifts from its approved scope: it begins steering determinations for request categories outside its policy, or keeps acting with persisted permissions after its use case is withdrawn."
    impact_type: "integrity"
    source: "S60; S26; S68; O01"
    reasoning_ref: "R-23; R-25; R-33; R-36"
  - id: "T-012"
    workflow: "prior_authorization"
    operator: "payer"
    actor: "trading_partner"
    owasp_asi: "ASI05"
    entry_surface: "ccda"
    scenario: "An agent that writes and runs code to convert or extract attached clinical documents processes a crafted attachment relayed through a compromised intermediary. The generated code runs operations nobody intended in the document-processing workspace, including reading other cases' files."
    impact_type: "both"
    source: "S05; S60; F01; STD03"
    reasoning_ref: "R-23; R-25"
  - id: "T-013"
    workflow: "prior_authorization"
    operator: "provider"
    actor: "upstream_supplier"
    owasp_asi: "ASI01"
    entry_surface: "hl7v2"
    scenario: "A provider-side agent assembles the outbound request packet. It follows comment text in an HL7 v2 results message from an outside lab and attaches far more than the request needs: other encounters and sensitive records, sent to the payer in breach of the minimum-necessary rule."
    impact_type: "confidentiality"
    source: "STD02; S11; S06; F01"
    reasoning_ref: "R-23; R-24; R-29"
  - id: "T-014"
    workflow: "claims"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI01"
    entry_surface: "x12"
    scenario: "Line-note free text in an 837 claim becomes content the claims-review agent can see. Instruction-like text in the note leads the agent to skip a review step or recommend payment."
    impact_type: "integrity"
    source: "G01; STD05; STD01; F01"
    reasoning_ref: "R-21; R-23; R-30"
  - id: "T-015"
    workflow: "claims"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI06"
    entry_surface: "memory"
    scenario: "Over many interactions, a provider seeds the agent's long-term memory of provider-specific exceptions with false precedents. Later claims from that provider are routed past review because the agent recalls an exception that was never granted."
    impact_type: "integrity"
    source: "S24; S60; S06; ADV01"
    reasoning_ref: "R-23; R-25; R-29"
  - id: "T-016"
    workflow: "claims"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI02"
    entry_surface: "fhir"
    scenario: "A supporting-information string in a FHIR claim leads an adjudication-support agent to invoke its line-adjustment or payment-hold-release tool on the wrong claim or with the wrong parameters."
    impact_type: "integrity"
    source: "STD04; S39; S67"
    reasoning_ref: "R-23; R-24; R-25"
  - id: "T-017"
    workflow: "claims"
    operator: "payer"
    actor: "provider_fraud"
    owasp_asi: "ASI03"
    entry_surface: "messaging"
    scenario: "An agent answering provider claim inquiries runs under a broad service identity that spans members and lines of business. A dishonest billing-office user's portal message gets it to retrieve and share claims history for members the provider does not treat."
    impact_type: "confidentiality"
    source: "S11; S05; S61"
    reasoning_ref: "R-23; R-25; R-29"
  - id: "T-018"
    workflow: "claims"
    operator: "payer"
    actor: "trading_partner"
    owasp_asi: "ASI07"
    entry_surface: "agent_to_agent"
    scenario: "Claim-status or appeal-packet messages from an intermediary are spoofed or altered by a compromised clearinghouse. The payer agent reopens or pays a claim on the strength of a message no trusted party sent."
    impact_type: "integrity"
    source: "S64; S01; STD01; ADV02"
    reasoning_ref: "R-23; R-25; R-29"
  - id: "T-019"
    workflow: "claims"
    operator: "payer"
    actor: "insider"
    owasp_asi: "ASI08"
    entry_surface: "knowledge"
    scenario: "One agent's misreading of a payment policy is written to shared knowledge and never checked by a careless reviewer. Denial-letter and appeals agents reuse it, so a single error becomes a pattern of improper denials across many members."
    impact_type: "integrity"
    source: "S62; S59; O01"
    reasoning_ref: "R-23; R-25; R-29"
